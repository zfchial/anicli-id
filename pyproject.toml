[project]
name = "anicli-id"
version = "0.3.0"
description = "CLI untuk nonton anime subtitle Indonesia langsung dari terminal (Otakudesu + Samehadaku)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
    "pypresence>=4.3.0",
]

[project.scripts]
anicli-id = "anicli_id.__main__:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
